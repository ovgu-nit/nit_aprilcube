tiago_gazebo:
  use_sim_time: true
  launch_arguments:
    is_public_sim: "True"
    world_name: tabletop_cube
    arm: "True"
    end_effector: pal-gripper
    tuck_arm: "True"
    moveit: "True"
  despawn_aruco_cube: true
  spawn_cube:
    pose:
      x: 1.0
      y: 0.0
      z: 1.0
      R: 0.1
      P: 0.1
      Y: 0.1

apriltag:
  remappings:
    image_rect: /head_front_camera/rgb/image_raw
  parameters:
    image_transport: raw
    family: 16h5
    size: 0.05
    pose_estimation_method: ""  # Empty string disables pose estimation
    tag:
      ids: [0,1,2,3,4,5]
      frames: [tag0_top,tag1_front,tag2_left,tag3_right,tag4_back,tag5_bottom]

image_annotator:
  remappings:
    image_raw: /head_front_camera/rgb/image_raw

rviz:
  launch_delay_sec: 2.0
  config_file: sim.rviz